name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate contracts and unit tests
        run: make validate
      - name: Check local markdown links
        run: make links

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional lint tools
        run: python -m pip install -e "./ml[dev]"
      - name: Lint Python
        run: make lint
      - name: Prepare reviewable lint fixes
        if: failure()
        run: |
          python -m ruff check ml --fix || true
          git diff -- ml > lint-suggestions.patch
          python -m ruff check ml --output-format=json > lint-findings.json || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: python-lint-diagnostics
          path: |
            lint-suggestions.patch
            lint-findings.json

  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Navigation-core tests
        run: ./gradlew :navigation-core:test --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-core-test-results
          path: packages/navigation-core/build/test-results/test/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Android unit tests, lint, debug APK
        run: ./gradlew :android-app:testDebugUnitTest :android-app:lintDebug :android-app:assembleDebug --no-daemon
