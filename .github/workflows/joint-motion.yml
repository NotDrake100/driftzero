name: Real-data joint motion training
on:
  workflow_dispatch:
  push:
    branches: [codex/joint-motion-real-data]
    paths: [.github/workflows/joint-motion.yml, ml/src/driftzero_ml/joint_sequence.py, ml/src/driftzero_ml/joint_network.py, ml/src/driftzero_ml/train_joint_sequence.py]
permissions:
  contents: read
jobs:
  screening:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research runtime
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Test model causality and gradients
        env:
          PYTHONPATH: ml/src
        run: python -m unittest discover -s ml/tests -p test_joint_sequence.py -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build replay
        run: ./gradlew :navigation-core:installDist --no-daemon
      - uses: actions/checkout@v4
        with:
          repository: onyekpeu/IO-VNBD
          ref: 118939602e3422d47b8ab0807b623751c3ac135b
          path: data/raw/io_vnbd
          lfs: false
          persist-credentials: false
      - name: Materialize pinned smartphone data only
        working-directory: data/raw/io_vnbd
        run: git lfs pull --include='**/Categorised IOVNB Dataset/**/S-*.csv'
      - name: Record provenance
        run: |
          mkdir -p results/joint_sequence_polar
          git rev-parse HEAD > results/joint_sequence_polar/code_commit.txt
          git -C data/raw/io_vnbd rev-parse HEAD > results/joint_sequence_polar/data_commit.txt
          git -C data/raw/io_vnbd lfs ls-files --long > results/joint_sequence_polar/lfs_objects.txt
          python --version > results/joint_sequence_polar/runtime.txt
          java -version 2>> results/joint_sequence_polar/runtime.txt
      - name: Train and score development checkpoints
        env:
          PYTHONPATH: ml/src
        run: python -m driftzero_ml.train_joint_sequence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joint-motion-evidence
          retention-days: 30
          path: results/joint_sequence_polar/
