name: Real-data joint motion training
on:
  workflow_dispatch:
  push:
    branches: [codex/joint-motion-real-data, codex/long-outage-motion]
    paths: [.github/workflows/joint-motion.yml, ml/src/driftzero_ml/joint_sequence.py, ml/src/driftzero_ml/joint_network.py, ml/src/driftzero_ml/train_joint_sequence.py]
permissions:
  contents: read
  actions: read
jobs:
  screening:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research runtime
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Test model causality and gradients
        env:
          PYTHONPATH: ml/src
        run: python -m unittest discover -s ml/tests -p test_joint_sequence.py -v
      - name: Download frozen training and development replay cache
        uses: actions/download-artifact@v4
        with:
          name: joint-motion-evidence
          run-id: 34470745169
          github-token: ${{ github.token }}
          path: research-cache/long
      - name: Verify frozen training cache
        run: echo "89bd4da16dad62a5c6f58e9c0f97f2027888a1b9289a2891194f72bf79de2aa7  research-cache/long/training_samples.pt" | sha256sum --check
      - name: Record provenance
        run: |
          mkdir -p results/joint_sequence_integrated
          git rev-parse HEAD > results/joint_sequence_integrated/code_commit.txt
          cp research-cache/long/data_commit.txt results/joint_sequence_integrated/data_commit.txt
          cp research-cache/long/lfs_objects.txt results/joint_sequence_integrated/lfs_objects.txt
          python --version > results/joint_sequence_integrated/runtime.txt
      - name: Train and score development checkpoints
        env:
          PYTHONPATH: ml/src
        run: python -m driftzero_ml.train_joint_sequence --out results/joint_sequence_integrated --window-s 180 --epochs 32 --checkpoint-every 8 --architectures mlp tcn --increment-weight 1 --tail-weight 0.5 --cached-run research-cache/long --projected-only --head-mode integrated
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joint-motion-evidence
          retention-days: 30
          path: results/joint_sequence_integrated/
