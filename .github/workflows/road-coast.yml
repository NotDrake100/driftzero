name: Real-map road coast research
on:
  workflow_dispatch:
  push:
    branches: [codex/driftzero-road-coast]
    paths: [.github/workflows/road-coast.yml, ml/src/driftzero_ml/osm_coast.py, ml/src/driftzero_ml/eval_osm_coast.py]
permissions:
  contents: read
  actions: read
jobs:
  screening:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore prior map snapshots when available
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: road-coast-evidence
          run-id: 34061171471
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: results/road_coast
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build replay
        run: ./gradlew :navigation-core:installDist --no-daemon
      - uses: actions/checkout@v4
        with:
          repository: onyekpeu/IO-VNBD
          ref: 118939602e3422d47b8ab0807b623751c3ac135b
          path: data/raw/io_vnbd
          lfs: false
          persist-credentials: false
      - name: Materialize pinned smartphone data only
        working-directory: data/raw/io_vnbd
        run: git lfs pull --include='**/Categorised IOVNB Dataset/**/S-*.csv'
      - name: Record provenance
        run: |
          mkdir -p results/road_coast
          git rev-parse HEAD > results/road_coast/code_commit.txt
          git -C data/raw/io_vnbd rev-parse HEAD > results/road_coast/data_commit.txt
      - name: Select on development sessions and confirm once on locked suite
        env:
          PYTHONPATH: ml/src
        run: |
          python -m driftzero_ml.eval_osm_coast --download-maps
          python -m driftzero_ml.eval_osm_coast --acceleration-model
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: road-coast-evidence
          retention-days: 30
          path: |
            results/road_coast/
            results/road_acceleration/
