# Documentation only. No Kotlin or Python path loads this file today.
# Screening v1 lives in results/io_vnbd_screening_v1/summary.md.
# minimum_truth_quality is not implemented as a loader check (docs/07 D4).
schema_version: "1.0.0"
protocol_id: ioh_vnbd_blackouts_v1
seed: 20260902
selection:
  operate_on_complete_trips: true
  minimum_truth_quality: valid  # documentation only. Not enforced by a loader.
  minimum_sensor_coverage_fraction: 0.99
  stratify_by: [duration, distance, speed_band, turn_presence, stop_presence]
suites:
  short:
    durations_s: [5, 10, 20, 30]
  medium:
    durations_s: [45, 60, 90, 120]
  long_stress:
    durations_s: [180, 300]
  official_examples:
    target_distances_m: [50, 1000]
mask_during_blackout:
  - gnss_position
  - gnss_speed
  - gnss_bearing
  - gnss_accuracy
  - gnss_satellite_status
  - raw_gnss
forbidden:
  future_fill: true
  bidirectional_smoothing: true
  truth_route_as_map_prior: true
  score_truth_in_feature_scaler: true
report:
  primary_metric: endpoint_drift_ratio
  quantiles: [0.5, 0.9, 0.95]
  include_worst_case: true
  include_per_interval_rows: true

