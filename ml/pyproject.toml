[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftzero-ml"
version = "0.1.0"
description = "Leakage-resistant evaluation and optional TimesFM research adapters for DriftZero"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.6"]
research = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=17", "torch>=2.4", "timesfm[torch]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
